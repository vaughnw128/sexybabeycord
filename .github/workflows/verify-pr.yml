name: Verify PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  verify-pr:
    uses: vaughnw128/hakoniwa/.github/workflows/verify-pr.yml@main
    with:
      pr-title: ${{ github.event.pull_request.title }}
      pr-body: ${{ github.event.pull_request.body || '' }}
