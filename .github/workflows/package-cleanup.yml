name: Package Cleanup

on:
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    uses: vaughnw128/hakoniwa/.github/workflows/package-cleanup.yml@main
    with:
      package-name: ${{ github.event.repository.name }}
      retention-days: 14
      tag-prefixes: pr-
      exact-tags: buildcache
      min-versions-to-keep: 5
      dry-run: false
