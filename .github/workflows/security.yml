name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    uses: vaughnw128/hakoniwa/.github/workflows/code-scanning.yml@main
    with:
      language: python
      codeql-languages: '["python"]'
    secrets: inherit
