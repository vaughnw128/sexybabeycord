name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  actions: read
  issues: write
  security-events: write

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: vaughnw128/hakoniwa/.github/workflows/code-scanning.yml@main
    with:
      language: python
    secrets: inherit

  notify-failure:
    needs: scan
    if: ${{ always() && github.event_name == 'pull_request' && needs.scan.result != 'success' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: vaughnw128/hakoniwa/.github/workflows/pr-failure-comment.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      title: "Security checks failed."
