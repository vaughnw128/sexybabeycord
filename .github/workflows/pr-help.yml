name: PR Help

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  help:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: vaughnw128/hakoniwa/.github/workflows/pr-help.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      preview-command: euclid build
      release-command: euclid release
      required-approvals: "0"
    secrets: inherit
