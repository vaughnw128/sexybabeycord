name: PR Candidate

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ startsWith(github.event.comment.body || '', 'euclid build') && format('candidate-{0}', github.event.issue.number) || format('issue-comment-{0}-{1}', github.event.issue.number, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    if: ${{ github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    permissions:
      actions: read
      contents: read
      issues: write
      checks: write
      packages: write
      pull-requests: read
      security-events: write
    uses: vaughnw128/hakoniwa/.github/workflows/pr-candidate-command.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-body: ${{ github.event.comment.body || '' }}
      comment-author-association: ${{ github.event.comment.author_association || '' }}
      comment-author-type: ${{ github.event.comment.user.type || '' }}
      command-prefix: euclid build
      allow-forks: false
      language: python
      python-version: "3.14"
      helm-path: ./helm
      chart-name: sexybabeycord
      platforms: linux/amd64
    secrets: inherit
