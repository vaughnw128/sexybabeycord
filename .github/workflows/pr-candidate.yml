name: PR Candidate

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ startsWith(github.event.comment.body || '', 'euclid build') && format('candidate-{0}', github.event.issue.number) || format('issue-comment-{0}-{1}', github.event.issue.number, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: read

jobs:
  prepare:
    if: ${{ github.event.issue.pull_request }}
    uses: vaughnw128/hakoniwa/.github/workflows/pr-comment-prepare.ymlmain
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-body: ${{ github.event.comment.body || '' }}
      comment-author-association: ${{ github.event.comment.author_association || '' }}
      command-prefix: euclid build
      allow-forks: false
    secrets: inherit

  candidate:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    uses: vaughnw128/hakoniwa/.github/workflows/candidate.ymlmain
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}
      candidate-kind: pr
      candidate-id: ${{ needs.prepare.outputs.pr_number }}
      language: python
      helm-path: ./helm
      chart-name: sexybabeycord
    secrets: inherit
