name: PR Release

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ startsWith(github.event.comment.body || '', 'euclid release') && format('release-{0}', github.event.issue.number) || format('issue-comment-{0}-{1}', github.event.issue.number, github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.issue.pull_request }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      checks: read
      actions: read
      security-events: write
    uses: vaughnw128/hakoniwa/.github/workflows/release-command.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-body: ${{ github.event.comment.body || '' }}
      comment-author-association: ${{ github.event.comment.author_association || '' }}
      command-prefix: euclid release
      language: python
      python-version: "3.14"
      helm-path: ./helm
      chart-name: sexybabeycord
      platforms: linux/amd64
      merge-method: squash
      require-approval: true
    secrets: inherit
