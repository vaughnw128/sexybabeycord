name: PR Release

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ startsWith(github.event.comment.body || '', 'euclid release') && format('release-{0}', github.event.issue.number) || format('issue-comment-{0}-{1}', github.event.issue.number, github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  checks: read
  actions: read

jobs:
  release:
    if: ${{ github.event.issue.pull_request }}
    uses: vaughnw128/hakoniwa/.github/workflows/release-command.yml@v1
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-body: ${{ github.event.comment.body || '' }}
      comment-author-association: ${{ github.event.comment.author_association || '' }}
      command-prefix: euclid release
      language: python
      helm-path: ./helm
      chart-name: sexybabeycord
      merge-method: squash
      require-approval: true
    secrets: inherit
